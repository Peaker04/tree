name: CI & Mobile Build

on:
  push:
    branches:
      - base-setup
      - main
  pull_request:
    branches:
      - base-setup
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Test Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: novyx_admin
          POSTGRES_PASSWORD: novyx_ci_admin_password
          POSTGRES_DB: novyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novyx_admin -d novyx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_MIGRATION_URL: postgresql://novyx_admin:novyx_ci_admin_password@localhost:5432/novyx_test
      DATABASE_RUNTIME_URL: postgresql://app_runtime:novyx_ci_runtime_password@localhost:5432/novyx_test
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: novyx-evidence
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadminpassword
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Build API workspace
        run: npm run build --workspace @novyx/api

      - name: Start test S3 server
        run: |
          node scripts/test-s3-server.cjs &
          sleep 1

      - name: Setup test S3 bucket
        run: |
          node scripts/setup-s3-test.cjs

      - name: Run PostgreSQL migrations and role bootstrap
        run: npm run db:migrate --workspace @novyx/api

      - name: Verify PostgreSQL schema and roles
        run: npm run db:verify --workspace @novyx/api

      - name: Run automated test suite (including DB and S3 integration)
        run: npm test

  build-android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Project
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novyx-greenops-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA
    needs: quality
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode with Device SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS Native Project
        run: |
          cd apps/mobile
          npx expo prebuild --platform ios --no-install

      - name: Apply Swift compatibility patch for Xcode 16
        run: node scripts/patch-ios-swift.cjs

      - name: Install CocoaPods
        run: |
          cd apps/mobile/ios
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local
          pod install

          # Đảm bảo các file codegen luôn nằm đúng trong đường dẫn ReactCodegen/ mà Pods.xcodeproj yêu cầu
          if [ -d "build/generated/ios" ] && [ ! -d "build/generated/ios/ReactCodegen/safeareacontext" ] && [ -d "build/generated/ios/safeareacontext" ]; then
            mkdir -p build/generated/ios/ReactCodegen
            cp -R build/generated/ios/* build/generated/ios/ReactCodegen/ 2>/dev/null || true
          fi

          # Ngăn script_phases.sh của target ReactCodegen tự động xóa/ghi đè lại build/generated/ios trong lúc xcodebuild đang CompileC
          SCRIPT_PHASES=$(node -p "require.resolve('react-native/scripts/react_native_pods_utils/script_phases.sh')")
          if [ -f "$SCRIPT_PHASES" ]; then
            printf '#!/bin/sh\nexit 0\n' > "$SCRIPT_PHASES"
            chmod +x "$SCRIPT_PHASES"
          fi

      - name: Build Unsigned iOS App
        run: |
          cd apps/mobile

          # Đảm bảo thư mục build sạch sẽ mà không xoá ios/build/generated do Codegen sinh ra
          rm -rf ios/build/derived ios/build/Payload ios/build/*.ipa

          # Kiểm tra nhanh các file Codegen trước khi vào xcodebuild
          ls -la ios/build/generated/ios/ReactCodegen || true

          # Chạy xcodebuild với cờ bỏ qua code signing đầy đủ cho toàn bộ pod targets
          xcodebuild \
            -workspace ios/NOVYX.xcworkspace \
            -scheme NOVYX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENTITLEMENTS_REQUIRED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO

          # Đóng gói thành .ipa sau khi build thành công
          mkdir -p ios/build/Payload
          APP_PATH=$(find ios/build/derived/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" ios/build/Payload/
            cd ios/build && zip -r -q NOVYX-unsigned.ipa Payload
          else
            echo "Error: No .app bundle found in Release-iphoneos" && exit 1
          fi
        shell: bash

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novyx-greenops-ios-ipa
          path: apps/mobile/ios/build/NOVYX-unsigned.ipa
          retention-days: 14
