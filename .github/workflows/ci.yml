name: CI

on:
  push:
    branches:
      - base-setup
      - main
  pull_request:
    branches:
      - base-setup
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Test Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: novyx_admin
          POSTGRES_PASSWORD: novyx_test_password
          POSTGRES_DB: novyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novyx_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_MIGRATION_URL: postgresql://novyx_admin:novyx_test_password@localhost:5432/novyx_test
      DATABASE_RUNTIME_URL: postgresql://app_runtime:app_runtime_password@localhost:5432/novyx_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Build API workspace
        run: npm run build --workspace @novyx/api

      - name: Run PostgreSQL migrations and role bootstrap
        run: npm run db:migrate --workspace @novyx/api

      - name: Verify PostgreSQL schema and roles
        run: npm run db:verify --workspace @novyx/api

      - name: Run automated test suite (including DB integration)
        run: npm test
