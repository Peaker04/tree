name: CI & Mobile Build

on:
  push:
    branches:
      - base-setup
      - main
  pull_request:
    branches:
      - base-setup
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Test Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: novyx_admin
          POSTGRES_PASSWORD: novyx_ci_admin_password
          POSTGRES_DB: novyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novyx_admin -d novyx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_MIGRATION_URL: postgresql://novyx_admin:novyx_ci_admin_password@localhost:5432/novyx_test
      DATABASE_RUNTIME_URL: postgresql://app_runtime:novyx_ci_runtime_password@localhost:5432/novyx_test
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: novyx-evidence
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadminpassword
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Build API workspace
        run: npm run build --workspace @novyx/api

      - name: Start test S3 server
        run: |
          node scripts/test-s3-server.cjs &
          sleep 1

      - name: Setup test S3 bucket
        run: |
          node scripts/setup-s3-test.cjs

      - name: Run PostgreSQL migrations and role bootstrap
        run: npm run db:migrate --workspace @novyx/api

      - name: Verify PostgreSQL schema and roles
        run: npm run db:verify --workspace @novyx/api

      - name: Run automated test suite (including DB and S3 integration)
        run: npm test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Project
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        env:
          EXPO_PUBLIC_API_BASE_URL: https://cannot-gutter-retry.ngrok-free.dev
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_DATA_SOURCE: rest
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || 'AIzaSyAUZzJiwd3Ols2Dtnb_Lys4zY1YeDEpCLU' }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY_ANDROID: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID || 'AIzaSyAUZzJiwd3Ols2Dtnb_Lys4zY1YeDEpCLU' }}
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload Android APK Artifact
        id: upload-android
        uses: actions/upload-artifact@v4
        with:
          name: novyx-greenops-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
        continue-on-error: true

      - name: Retry Upload Android APK
        if: steps.upload-android.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: novyx-greenops-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode matching Expo prebuilt SDK (Swift 6.3+)
        run: |
          # Expo SDK 57 ships prebuilt xcframeworks built with Swift 6.3.
          # Xcode 16.4 only has Swift 6.1 → binary module mismatch.
          # Pick the newest Xcode 26.x available on the runner (has Swift 6.2+/6.3).
          XCODE_PATH=""
          for v in 26.4 26.3 26.2 26.1.1 26.1 26.0.1 26.0; do
            candidate="/Applications/Xcode_${v}.app"
            if [ -d "$candidate" ]; then
              XCODE_PATH="$candidate"
              break
            fi
          done
          # Fallback to default Xcode if no 26.x found
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS Native Project
        env:
          CI_STRIP_DEV_CLIENT: '1'
          EXPO_PUBLIC_API_BASE_URL: https://cannot-gutter-retry.ngrok-free.dev
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_DATA_SOURCE: rest
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || 'AIzaSyAUZzJiwd3Ols2Dtnb_Lys4zY1YeDEpCLU' }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY_IOS: ${{ secrets.GOOGLE_MAPS_API_KEY_IOS || 'AIzaSyBqTgH8psaGgNsUqEQuo58Af0c-XezhbfY' }}
        run: |
          cd apps/mobile
          # CI_STRIP_DEV_CLIENT=1 causes app.config.js to exclude expo-dev-client from plugins.
          # expo-dev-client adds aps-environment + dev-menu entitlements that crash instantly
          # on unsigned/sideloaded IPA (free Apple ID) — it is only needed for local dev.
          npx expo prebuild --platform ios --no-install

      - name: Apply Swift compatibility patches
        run: node scripts/patch-ios-swift.cjs

      - name: Install CocoaPods
        env:
          CI_STRIP_DEV_CLIENT: '1'
        run: |
          cd apps/mobile/ios
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local
          # CI_STRIP_DEV_CLIENT=1 tells react-native.config.js to exclude expo-dev-client
          # from autolinking so it is NOT added to the Podfile/native project.
          pod install

          # Re-run patch after pod install downloads prebuilt xcframeworks
          node ../../../scripts/patch-ios-swift.cjs

          # Disable Code Signing in Pods.xcodeproj for unsigned CI builds
          sed -i '' 's/buildSettings = {/buildSettings = { CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = ""; EXPANDED_CODE_SIGN_IDENTITY = "";/g' Pods/Pods.xcodeproj/project.pbxproj

      - name: Build Unsigned iOS App
        env:
          EXPO_PUBLIC_API_BASE_URL: https://cannot-gutter-retry.ngrok-free.dev
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_DATA_SOURCE: rest
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY_IOS: ${{ secrets.GOOGLE_MAPS_API_KEY_IOS || 'AIzaSyBqTgH8psaGgNsUqEQuo58Af0c-XezhbfY' }}
        run: |
          set -o pipefail
          cd apps/mobile

          # Đảm bảo thư mục build sạch sẽ mà không xoá ios/build/generated do Codegen sinh ra
          rm -rf ios/build/derived ios/build/Payload ios/build/*.ipa ios/build/xcodebuild.log
          mkdir -p ios/build

          # Chạy xcodebuild (Đã bỏ BUILD_LIBRARY_FOR_DISTRIBUTION=NO để không làm hỏng ExpoModulesJSI xcframework)
          if ! xcodebuild \
            -workspace ios/NOVYX.xcworkspace \
            -scheme NOVYX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENTITLEMENTS_REQUIRED=NO 2>&1 | tee ios/build/xcodebuild.log; then
            echo "========== CHI TIẾT LỖI XCODEBUILD =========="
            grep -E "(error:|fatal error:|Script-46EB2E0001AF50\.sh)" -B 5 -A 20 ios/build/xcodebuild.log || true
            echo "========== NỘI DUNG SCRIPT EXPOMODULESJSI =========="
            cat ios/build/derived/Build/Intermediates.noindex/Pods.build/Release-iphoneos/ExpoModulesJSI.build/Script-46EB2E0001AF50.sh || true
            exit 1
          fi

          # Đóng gói thành .ipa sau khi build thành công
          mkdir -p ios/build/Payload
          APP_PATH=$(find ios/build/derived/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" ios/build/Payload/
            cd ios/build && zip -r -q NOVYX-unsigned.ipa Payload
          else
            echo "Error: No .app bundle found in Release-iphoneos" && exit 1
          fi
        shell: bash

      - name: Upload iOS IPA Artifact
        id: upload-ios
        uses: actions/upload-artifact@v4
        with:
          name: novyx-greenops-ios-ipa
          path: apps/mobile/ios/build/NOVYX-unsigned.ipa
          retention-days: 14
        continue-on-error: true

      - name: Retry Upload iOS IPA
        if: steps.upload-ios.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: novyx-greenops-ios-ipa
          path: apps/mobile/ios/build/NOVYX-unsigned.ipa
          retention-days: 14
