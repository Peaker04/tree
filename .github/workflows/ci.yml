name: CI & Mobile Build

on:
  push:
    branches:
      - base-setup
      - main
  pull_request:
    branches:
      - base-setup
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Test Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: novyx_admin
          POSTGRES_PASSWORD: novyx_ci_admin_password
          POSTGRES_DB: novyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novyx_admin -d novyx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_MIGRATION_URL: postgresql://novyx_admin:novyx_ci_admin_password@localhost:5432/novyx_test
      DATABASE_RUNTIME_URL: postgresql://app_runtime:novyx_ci_runtime_password@localhost:5432/novyx_test
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: novyx-evidence
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadminpassword
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Build API workspace
        run: npm run build --workspace @novyx/api

      - name: Start test S3 server
        run: |
          node scripts/test-s3-server.cjs &
          sleep 1

      - name: Setup test S3 bucket
        run: |
          node scripts/setup-s3-test.cjs

      - name: Run PostgreSQL migrations and role bootstrap
        run: npm run db:migrate --workspace @novyx/api

      - name: Verify PostgreSQL schema and roles
        run: npm run db:verify --workspace @novyx/api

      - name: Run automated test suite (including DB and S3 integration)
        run: npm test

  build-android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Project
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novyx-greenops-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA
    needs: quality
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Stable Xcode 16.1
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS Native Project
        run: |
          cd apps/mobile
          npx expo prebuild --platform ios --no-install

      - name: Apply Swift compatibility patch for Xcode 16
        run: node scripts/patch-ios-swift.cjs

      - name: Install CocoaPods
        run: |
          cd apps/mobile/ios
          pod install

      - name: Build iOS App & Package Unsigned IPA
        run: |
          xcodebuild -workspace apps/mobile/ios/NOVYX.xcworkspace \
            -scheme NOVYX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath apps/mobile/ios/build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p apps/mobile/ios/build/Payload
          APP_PATH=$(find apps/mobile/ios/build/derived/Build/Products -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" apps/mobile/ios/build/Payload/
            cd apps/mobile/ios/build && zip -r -q NOVYX-unsigned.ipa Payload
          else
            echo "No .app bundle found" && exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novyx-greenops-ios-ipa
          path: apps/mobile/ios/build/NOVYX-unsigned.ipa
          retention-days: 14
