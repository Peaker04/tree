<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROPOSED 04 - Chính sách Bằng chứng theo Loại việc & Làm lại Trọng tâm</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #fbfbf9;
        --color-paper-2: #f0efea;
        --color-ink: #112116;
        --color-muted: #68756b;
        --color-rule: rgba(17, 33, 22, 0.08);
        --color-rule-solid: #e2e0d8;
        --color-accent: #166534;
        --color-lime: #84cc16;
        --color-amber: #d97706;
        --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
        --font-serif: 'Instrument Serif', Georgia, serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }

      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
      }

      .frame {
        max-width: 1150px;
        width: 100%;
        margin: 0 auto;
      }
      .badge-proposed {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: #d97706;
        color: #fff;
        padding: 3px 8px;
        border-radius: 4px;
        margin-bottom: 0.5rem;
      }

      h1 {
        font-family: var(--font-serif);
        font-size: 2.1rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 0.5rem;
      }

      .desc {
        font-size: 0.92rem;
        color: var(--color-muted);
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }

      svg {
        width: 100%;
        display: block;
        border: 1px solid var(--color-rule-solid);
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="badge-proposed">PROPOSED — CHỜ PHÊ DUYỆT</div>
      <h1>Chính sách Bằng chứng theo Loại việc &amp; Làm lại Trọng tâm</h1>
      <p class="desc">
        Phân loại yêu cầu bằng chứng phù hợp tính chất vật lý của công việc, cùng cơ chế khắc phục lỗi có trọng tâm
        không làm mất dữ liệu cũ.
      </p>

      <svg viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" role="img">
        <rect width="100%" height="100%" fill="#FBFBF9" />

        <!-- SECTION 1: PROOF POLICIES (LEFT) -->
        <g transform="translate(40, 30)">
          <rect x="0" y="0" width="480" height="550" rx="8" fill="#FFF" stroke="#166534" stroke-width="1.8" />
          <rect x="20" y="-12" width="260" height="24" rx="4" fill="#166534" />
          <text x="30" y="4" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#FFF">
            CHÍNH SÁCH BẰNG CHỨNG (PROOF POLICY)
          </text>

          <!-- Policy A: Full -->
          <g transform="translate(20, 35)">
            <rect
              x="0"
              y="0"
              width="440"
              height="230"
              rx="6"
              fill="rgba(132,204,22,0.06)"
              stroke="#84CC16"
              stroke-width="1.5"
            />
            <text x="16" y="26" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#166534">
              1. CHÍNH SÁCH TOÀN DIỆN (FULL PROOF)
            </text>
            <text x="16" y="44" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              Áp dụng cho: Cắt tỉa cành, Bón phân, Xử lý sâu bệnh, Trồng mới
            </text>
            <line x1="16" y1="54" x2="424" y2="54" stroke="#E2E0D8" />

            <g transform="translate(16, 70)">
              <text x="0" y="16" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
                ✓ Xác thực GPS (Bán kính &lt;= 10m hoặc cảnh báo mềm)
              </text>
              <text x="0" y="38" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
                ✓ Quét mã QR thân cây (Hoặc báo mã hỏng + nhập mã)
              </text>
              <text x="0" y="60" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#166534">
                ✓ BẮT BUỘC ẢNH TRƯỚC (Ghi nhận hiện trạng cây)
              </text>
              <text x="0" y="82" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
                ✓ Checklist kỹ thuật hoàn thành 100%
              </text>
              <text x="0" y="104" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#166534">
                ✓ BẮT BUỘC ẢNH SAU (Nghiệm thu kết quả can thiệp)
              </text>
              <text x="0" y="130" font-family="'Geist Mono', monospace" font-size="10" fill="#166534">
                -> Báo cáo có cặp ảnh Trước/Sau đối chiếu.
              </text>
            </g>
          </g>

          <!-- Policy B: Light -->
          <g transform="translate(20, 285)">
            <rect x="0" y="0" width="440" height="235" rx="6" fill="#F0EFEA" stroke="#E2E0D8" stroke-width="1.2" />
            <text x="16" y="26" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#112116">
              2. CHÍNH SÁCH TINH GỌN (LIGHT PROOF)
            </text>
            <text x="16" y="44" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              Áp dụng cho: Tưới nước định kỳ, Khảo sát sức khỏe cây xanh
            </text>
            <line x1="16" y1="54" x2="424" y2="54" stroke="#E2E0D8" />

            <g transform="translate(16, 70)">
              <text x="0" y="16" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
                ✓ Xác thực GPS (Bán kính &lt;= 10m hoặc cảnh báo mềm)
              </text>
              <text x="0" y="38" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
                ✓ Quét mã QR thân cây (Hoặc báo mã hỏng + nhập mã)
              </text>
              <text x="0" y="60" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
                ✓ Checklist kiểm tra thao tác thực địa
              </text>
              <text x="0" y="82" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#166534">
                ✓ 01 ẢNH MINH CHỨNG HIỆN TRƯỜNG DUY NHẤT
              </text>
              <text x="0" y="104" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
                (Không bắt chụp ảnh Trước/Sau nhân tạo)
              </text>
              <text x="0" y="130" font-family="'Geist Mono', monospace" font-size="10" fill="#166534">
                -> Tiết kiệm 40% thao tác ngoài trời nắng cho thợ.
              </text>
            </g>
          </g>
        </g>

        <!-- SECTION 2: TARGETED REWORK (RIGHT) -->
        <g transform="translate(560, 30)">
          <rect x="0" y="0" width="480" height="550" rx="8" fill="#FFF" stroke="#D97706" stroke-width="1.8" />
          <rect x="20" y="-12" width="280" height="24" rx="4" fill="#D97706" />
          <text x="30" y="4" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#FFF">
            LÀM LẠI CÓ TRỌNG TÂM (TARGETED REWORK)
          </text>

          <g transform="translate(20, 35)">
            <text x="0" y="20" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#112116">
              Cơ chế bảo toàn bằng chứng &amp; Hồi phục nhanh
            </text>
            <text x="0" y="38" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              Khi Quản lý từ chối nghiệm thu, thợ không bị ép làm lại từ đầu:
            </text>

            <!-- Step 1 in Rework -->
            <rect x="0" y="55" width="440" height="100" rx="6" fill="#FBFBF9" stroke="#E2E0D8" />
            <text x="14" y="24" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#D97706">
              BƯỚC 1: Quản lý chọn đích danh khâu chưa đạt
            </text>
            <text x="14" y="42" font-family="'Geist', sans-serif" font-size="10" fill="#112116">
              • Chọn lý do từ chips: "Ảnh sau mờ", "Thiếu dọn cành", v.v.
            </text>
            <text x="14" y="58" font-family="'Geist', sans-serif" font-size="10" fill="#112116">
              • Chỉ định rõ: Cần chụp lại ảnh sau HOẶC bổ sung checklist
            </text>
            <text x="14" y="78" font-family="'Geist Mono', monospace" font-size="9" fill="#166534">
              -> Toàn bộ GPS, QR, Ảnh Trước đã duyệt ĐƯỢC GIỮ NGUYÊN
            </text>

            <!-- Step 2 in Rework -->
            <rect x="0" y="170" width="440" height="100" rx="6" fill="#FBFBF9" stroke="#E2E0D8" />
            <text x="14" y="24" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#112116">
              BƯỚC 2: Thẻ việc ưu tiên số 0 trên hàng đợi Staff
            </text>
            <text x="14" y="42" font-family="'Geist', sans-serif" font-size="10" fill="#112116">
              • Hiển thị hộp thông báo vàng ghi rõ lý do của Quản lý
            </text>
            <text x="14" y="58" font-family="'Geist', sans-serif" font-size="10" fill="#112116">
              • Nút bấm duy nhất: "Tiếp tục làm lại"
            </text>
            <text x="14" y="78" font-family="'Geist Mono', monospace" font-size="9" fill="#166534">
              -> Nhảy thẳng vào khâu cần sửa (Không bắt đi lại từ bước 1)
            </text>

            <!-- Step 3 in Rework -->
            <rect x="0" y="285" width="440" height="110" rx="6" fill="rgba(217,119,6,0.06)" stroke="#D97706" />
            <text x="14" y="24" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#D97706">
              BƯỚC 3: Bổ sung bằng chứng &amp; Gửi lại
            </text>
            <text x="14" y="42" font-family="'Geist', sans-serif" font-size="10" fill="#112116">
              • Thợ chụp ảnh sau mới hoặc tích lại checklist
            </text>
            <text x="14" y="58" font-family="'Geist', sans-serif" font-size="10" fill="#112116">
              • Bấm "Nộp lại báo cáo" -> Quay lại trạng thái Waiting_Review
            </text>
            <text x="14" y="78" font-family="'Geist Mono', monospace" font-size="9" fill="#166534">
              -> Quản lý đối chiếu ngay ảnh mới sửa với lý do vừa yêu cầu
            </text>
            <text x="14" y="94" font-family="'Geist', sans-serif" font-size="9" fill="#68756B">
              Khép kín chu trình không gây bế tắc.
            </text>
          </g>
        </g>
      </svg>
    </div>
  </body>
</html>
