<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>05 - NOVYX Proof Acquisition Workflow</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #fbfbf9;
        --color-paper-2: #f0efea;
        --color-ink: #112116;
        --color-muted: #68756b;
        --color-rule: rgba(17, 33, 22, 0.08);
        --color-rule-solid: #e2e0d8;
        --color-accent: #166534;
        --color-lime: #84cc16;
        --color-danger: #dc2626;
        --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
        --font-serif: 'Instrument Serif', Georgia, serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }

      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
      }

      .frame {
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }

      h1 {
        font-family: var(--font-serif);
        font-size: 2.1rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 0.5rem;
      }

      .desc {
        font-size: 0.92rem;
        color: var(--color-muted);
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }

      svg {
        width: 100%;
        display: block;
        border: 1px solid var(--color-rule-solid);
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">05 · In-Flight Field Workflow · Workflow B</p>
      <h1>Quy trình Thu thập Bằng chứng Hiện trường (Proof Acquisition)</h1>
      <p class="desc">
        Chuỗi 5 chốt bằng chứng bất biến (Invariants) với các điểm chốt chặn và cơ chế hồi phục khi gặp sự cố.
      </p>

      <svg viewBox="0 0 1020 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pw-title pw-desc">
        <title id="pw-title">NOVYX Proof Acquisition Workflow</title>
        <desc id="pw-desc">Quy trình tuần tự 5 bước lấy bằng chứng từ GPS đến khi Nộp báo cáo.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#166534" />
          </marker>
          <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#DC2626" />
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#FBFBF9" />

        <!-- 6 BOXES SEQUENTIAL -->
        <!-- Step 1: GPS -->
        <g transform="translate(40, 100)">
          <rect x="0" y="0" width="135" height="130" rx="8" fill="#FFF" stroke="#84CC16" stroke-width="2" />
          <rect x="12" y="14" width="22" height="22" rx="4" fill="rgba(132,204,22,0.18)" />
          <text
            x="23"
            y="29"
            text-anchor="middle"
            font-family="'Geist', sans-serif"
            font-size="12"
            font-weight="600"
            fill="#166534"
          >
            1
          </text>
          <text x="42" y="30" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Đo GPS</text>
          <text x="12" y="58" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">Lấy tọa độ thiết bị</text>
          <line x1="12" y1="70" x2="123" y2="70" stroke="#E2E0D8" />
          <text x="12" y="88" font-family="'Geist Mono', monospace" font-size="9" fill="#166534">GUARD (DR-01):</text>
          <text x="12" y="104" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#112116">
            cách cây &lt;= 10m
          </text>
          <text x="12" y="118" font-family="'Geist', sans-serif" font-size="9" fill="#68756B">Lưu GpsCheck</text>
        </g>

        <!-- Arrow 1 -> 2 -->
        <line x1="175" y1="165" x2="200" y2="165" stroke="#166534" stroke-width="2" marker-end="url(#arrow)" />

        <!-- Step 2: QR -->
        <g transform="translate(205, 100)">
          <rect x="0" y="0" width="135" height="130" rx="8" fill="#FFF" stroke="#84CC16" stroke-width="2" />
          <rect x="12" y="14" width="22" height="22" rx="4" fill="rgba(132,204,22,0.18)" />
          <text
            x="23"
            y="29"
            text-anchor="middle"
            font-family="'Geist', sans-serif"
            font-size="12"
            font-weight="600"
            fill="#166534"
          >
            2
          </text>
          <text x="42" y="30" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Quét QR</text>
          <text x="12" y="58" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">Quét mã thân cây</text>
          <line x1="12" y1="70" x2="123" y2="70" stroke="#E2E0D8" />
          <text x="12" y="88" font-family="'Geist Mono', monospace" font-size="9" fill="#166534">GUARD (DR-02):</text>
          <text x="12" y="104" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#112116">
            Khớp 100% cây
          </text>
          <text x="12" y="118" font-family="'Geist', sans-serif" font-size="9" fill="#68756B">Lưu QrCheck</text>
        </g>

        <!-- Arrow 2 -> 3 -->
        <line x1="340" y1="165" x2="365" y2="165" stroke="#166534" stroke-width="2" marker-end="url(#arrow)" />

        <!-- Step 3: Before Photo -->
        <g transform="translate(370, 100)">
          <rect x="0" y="0" width="135" height="130" rx="8" fill="#FFF" stroke="#84CC16" stroke-width="2" />
          <rect x="12" y="14" width="22" height="22" rx="4" fill="rgba(132,204,22,0.18)" />
          <text
            x="23"
            y="29"
            text-anchor="middle"
            font-family="'Geist', sans-serif"
            font-size="12"
            font-weight="600"
            fill="#166534"
          >
            3
          </text>
          <text x="42" y="30" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Ảnh Trước</text>
          <text x="12" y="58" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">Hiện trạng cây</text>
          <line x1="12" y1="70" x2="123" y2="70" stroke="#E2E0D8" />
          <text x="12" y="88" font-family="'Geist Mono', monospace" font-size="9" fill="#166534">GUARD (DR-03):</text>
          <text x="12" y="104" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#112116">
            Bắt buộc có ảnh
          </text>
          <text x="12" y="118" font-family="'Geist', sans-serif" font-size="9" fill="#68756B">Lưu URI cục bộ</text>
        </g>

        <!-- Arrow 3 -> 4 -->
        <line x1="505" y1="165" x2="530" y2="165" stroke="#166534" stroke-width="2" marker-end="url(#arrow)" />

        <!-- Step 4: Checklist -->
        <g transform="translate(535, 100)">
          <rect x="0" y="0" width="135" height="130" rx="8" fill="#FFF" stroke="#84CC16" stroke-width="2" />
          <rect x="12" y="14" width="22" height="22" rx="4" fill="rgba(132,204,22,0.18)" />
          <text
            x="23"
            y="29"
            text-anchor="middle"
            font-family="'Geist', sans-serif"
            font-size="12"
            font-weight="600"
            fill="#166534"
          >
            4
          </text>
          <text x="42" y="30" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Checklist</text>
          <text x="12" y="58" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">Hạng mục kỹ thuật</text>
          <line x1="12" y1="70" x2="123" y2="70" stroke="#E2E0D8" />
          <text x="12" y="88" font-family="'Geist Mono', monospace" font-size="9" fill="#166534">GUARD (DR-04):</text>
          <text x="12" y="104" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#112116">
            Hoàn thành 100%
          </text>
          <text x="12" y="118" font-family="'Geist', sans-serif" font-size="9" fill="#68756B">Tất cả item.done</text>
        </g>

        <!-- Arrow 4 -> 5 -->
        <line x1="670" y1="165" x2="695" y2="165" stroke="#166534" stroke-width="2" marker-end="url(#arrow)" />

        <!-- Step 5: After Photo -->
        <g transform="translate(700, 100)">
          <rect x="0" y="0" width="135" height="130" rx="8" fill="#FFF" stroke="#84CC16" stroke-width="2" />
          <rect x="12" y="14" width="22" height="22" rx="4" fill="rgba(132,204,22,0.18)" />
          <text
            x="23"
            y="29"
            text-anchor="middle"
            font-family="'Geist', sans-serif"
            font-size="12"
            font-weight="600"
            fill="#166534"
          >
            5
          </text>
          <text x="42" y="30" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Ảnh Sau</text>
          <text x="12" y="58" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">Nghiệm thu việc</text>
          <line x1="12" y1="70" x2="123" y2="70" stroke="#E2E0D8" />
          <text x="12" y="88" font-family="'Geist Mono', monospace" font-size="9" fill="#166534">GUARD (DR-03):</text>
          <text x="12" y="104" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#112116">
            Ảnh rõ nét
          </text>
          <text x="12" y="118" font-family="'Geist', sans-serif" font-size="9" fill="#68756B">Lưu URI cục bộ</text>
        </g>

        <!-- Arrow 5 -> 6 -->
        <line x1="835" y1="165" x2="860" y2="165" stroke="#166534" stroke-width="2" marker-end="url(#arrow)" />

        <!-- Step 6: Review & Submit -->
        <g transform="translate(865, 85)">
          <rect x="0" y="0" width="120" height="160" rx="8" fill="#166534" stroke="#112116" stroke-width="2" />
          <text x="14" y="28" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#FFF">
            6. RÀ SOÁT
          </text>
          <text x="14" y="46" font-family="'Geist Mono', monospace" font-size="10" fill="#84CC16">
            &amp; NỘP BÁO CÁO
          </text>
          <line x1="14" y1="58" x2="106" y2="58" stroke="rgba(255,255,255,0.2)" />
          <text x="14" y="78" font-family="'Geist', sans-serif" font-size="10" fill="#E2E0D8">Cổng 5/5 chốt</text>
          <text x="14" y="94" font-family="'Geist', sans-serif" font-size="10" fill="#E2E0D8">So sánh Trước/Sau</text>
          <text x="14" y="110" font-family="'Geist', sans-serif" font-size="10" fill="#E2E0D8">Ghi chú bổ sung</text>
          <rect x="12" y="125" width="96" height="24" rx="4" fill="#84CC16" />
          <text
            x="60"
            y="141"
            text-anchor="middle"
            font-family="'Geist Mono', monospace"
            font-size="10"
            font-weight="600"
            fill="#112116"
          >
            NỘP DUYỆT
          </text>
        </g>

        <!-- EXCEPTION RECOVERY PATHS (Bottom Panel) -->
        <g transform="translate(40, 290)">
          <rect x="0" y="0" width="945" height="190" rx="8" fill="#F0EFEA" stroke="#E2E0D8" stroke-width="1.2" />
          <rect x="20" y="-12" width="220" height="24" rx="4" fill="#68756B" />
          <text x="30" y="4" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#FFF">
            CÁC NHÁNH PHỤC HỒI NGOẠI LỆ
          </text>

          <!-- Recovery 1 -->
          <g transform="translate(25, 25)">
            <rect x="0" y="0" width="200" height="140" rx="6" fill="#FFF" stroke="#E2E0D8" />
            <text x="14" y="24" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#DC2626">
              GPS ngoài ngưỡng (&gt; 10m)
            </text>
            <text x="14" y="46" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              Khóa nút tiếp tục; hiện khoảng cách thực tế (ví dụ: 14.5m).
            </text>
            <text x="14" y="90" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#166534">
              Hồi phục: "Đo lại GPS"
            </text>
            <text x="14" y="110" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">
              Nhân viên tiến sát gốc cây.
            </text>
          </g>

          <!-- Recovery 2 -->
          <g transform="translate(245, 25)">
            <rect x="0" y="0" width="200" height="140" rx="6" fill="#FFF" stroke="#E2E0D8" />
            <text x="14" y="24" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#DC2626">
              Quét sai mã QR cây
            </text>
            <text x="14" y="46" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              Báo lỗi không đúng cây của task; không ghi nhận rác.
            </text>
            <text x="14" y="90" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#166534">
              Hồi phục: "Quét lại"
            </text>
            <text x="14" y="110" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">
              Mở lại camera quét mã đúng.
            </text>
          </g>

          <!-- Recovery 3 -->
          <g transform="translate(465, 25)">
            <rect x="0" y="0" width="200" height="140" rx="6" fill="#FFF" stroke="#E2E0D8" />
            <text x="14" y="24" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#DC2626">
              Mã QR bị mờ / hỏng
            </text>
            <text x="14" y="46" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              Camera không thể đọc do biển số cây bị trầy xước.
            </text>
            <text x="14" y="90" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#166534">
              Hồi phục: "Báo mã hỏng"
            </text>
            <text x="14" y="110" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">
              Gửi thông báo vận hành.
            </text>
          </g>

          <!-- Recovery 4 -->
          <g transform="translate(685, 25)">
            <rect x="0" y="0" width="235" height="140" rx="6" fill="#FFF" stroke="#E2E0D8" />
            <text x="14" y="24" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#DC2626">
              Rớt mạng khi làm việc
            </text>
            <text x="14" y="46" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              Mất sóng 3G/4G ngoài đường trong khi đang chụp ảnh.
            </text>
            <text x="14" y="90" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#166534">
              Hồi phục: Local Cache
            </text>
            <text x="14" y="110" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">
              Lưu offline; gửi khi có mạng.
            </text>
          </g>
        </g>
      </svg>
    </div>
  </body>
</html>
