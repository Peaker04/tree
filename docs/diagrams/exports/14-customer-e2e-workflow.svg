  <path d="M1100 202 H952 V276 H940" fill="none" stroke="#a06d08" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#arrow-amber)" />
  <rect x="964" y="186" width="112" height="20" rx="3" fill="#fffefb" />
  <text x="1020" y="200" text-anchor="middle" class="loop-label">Làm lại đúng mục</text>

