  <!-- Outcome strip -->
  <rect x="142" y="558" width="1106" height="104" rx="8" fill="#ffffff" stroke="#d5dfd1" />
  <line x1="510" y1="574" x2="510" y2="646" stroke="#d9e2d5" />
  <line x1="878" y1="574" x2="878" y2="646" stroke="#d9e2d5" />

  <text x="166" y="586" class="outcome-title">Duyệt / duyệt ngoại lệ</text>
  <text x="166" y="607" class="outcome-copy">Task hoàn thành; tạo lịch sử chăm sóc;</text>
  <text x="166" y="625" class="outcome-copy">Staff nhận kết quả.</text>

  <text x="534" y="586" class="outcome-title">Yêu cầu làm lại</text>
  <text x="534" y="607" class="outcome-copy">Giữ bằng chứng đã đạt; chỉ bổ sung đúng mục</text>
