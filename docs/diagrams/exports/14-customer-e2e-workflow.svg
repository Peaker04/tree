<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="novyx-e2e-title novyx-e2e-desc">
  <title id="novyx-e2e-title">NOVYX GreenOps — Quy trình vận hành E2E</title>
  <desc id="novyx-e2e-desc">Quy trình tám giai đoạn từ khởi tạo cây, giao việc, thực hiện ngoài hiện trường, tải bằng chứng, duyệt nghiệm thu đến hoàn thành hoặc làm lại có mục tiêu.</desc>
  
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text {
        font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    ]]></style>
  
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#617268" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#2f7d45" />
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#a06d08" />
    </marker>
    <style>
      .eyebrow { font: 600 11px 'Geist Mono', monospace; letter-spacing: .08em; fill: #52645a; }
      .title { font: 700 34px 'Noto Serif', serif; fill: #13231a; }
      .subtitle { font: 400 14px 'Noto Sans', sans-serif; fill: #64748b; }
      .stage-no { font: 700 11px 'Geist Mono', monospace; fill: #2f7d45; }
      .stage-name { font: 600 11px 'Noto Sans', sans-serif; fill: #52645a; }
      .lane-name { font: 700 14px 'Noto Sans', sans-serif; fill: #13231a; }
      .lane-key { font: 600 11px 'Geist Mono', monospace; fill: #64748b; letter-spacing: .05em; }
      .node-title { font: 700 13px 'Noto Sans', sans-serif; fill: #13231a; }
      .node-sub { font: 400 11px 'Noto Sans', sans-serif; fill: #435348; }
      .tech { font: 600 11px 'Geist Mono', monospace; fill: #435348; }
      .loop-label { font: 600 11px 'Noto Sans', sans-serif; fill: #80580b; }
      .outcome-title { font: 700 13px 'Noto Sans', sans-serif; fill: #13231a; }
      .outcome-copy { font: 400 11px 'Noto Sans', sans-serif; fill: #435348; }
      .footer { font: 600 11px 'Geist Mono', monospace; fill: #64748b; letter-spacing: .04em; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#f6f8f1" />

  <!-- Header -->
  <text x="40" y="36" class="eyebrow">NOVYX GREENOPS · CUSTOMER DEMO</text>
  <text x="40" y="76" class="title">Quy trình vận hành từ đầu đến cuối</text>
  <text x="40" y="100" class="subtitle">Từ cây ngoài hiện trường đến kết quả nghiệm thu có bằng chứng và truy vết.</text>
  <text x="1240" y="36" text-anchor="end" class="eyebrow">SOURCE: docs/WORKFLOWS.md · LIVE E2E</text>

  <!-- Stage headers -->
  <g>
    <text x="210" y="130" text-anchor="middle" class="stage-no">01</text><text x="210" y="146" text-anchor="middle" class="stage-name">Khởi tạo cây</text>
    <text x="345" y="130" text-anchor="middle" class="stage-no">02</text><text x="345" y="146" text-anchor="middle" class="stage-name">Giao việc</text>
    <text x="480" y="130" text-anchor="middle" class="stage-no">03</text><text x="480" y="146" text-anchor="middle" class="stage-name">Lưu canonical</text>
    <text x="615" y="130" text-anchor="middle" class="stage-no">04</text><text x="615" y="146" text-anchor="middle" class="stage-name">Bắt đầu</text>
    <text x="750" y="130" text-anchor="middle" class="stage-no">05</text><text x="750" y="146" text-anchor="middle" class="stage-name">Xác thực</text>
    <text x="885" y="130" text-anchor="middle" class="stage-no">06</text><text x="885" y="146" text-anchor="middle" class="stage-name">Bằng chứng</text>
    <text x="1020" y="130" text-anchor="middle" class="stage-no">07</text><text x="1020" y="146" text-anchor="middle" class="stage-name">Nộp báo cáo</text>
    <text x="1155" y="130" text-anchor="middle" class="stage-no">08</text><text x="1155" y="146" text-anchor="middle" class="stage-name">Nghiệm thu</text>
  </g>

