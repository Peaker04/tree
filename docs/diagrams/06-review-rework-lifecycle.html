<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>06 - NOVYX Review & Rework Lifecycle</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #fbfbf9;
        --color-paper-2: #f0efea;
        --color-ink: #112116;
        --color-muted: #68756b;
        --color-rule: rgba(17, 33, 22, 0.08);
        --color-rule-solid: #e2e0d8;
        --color-accent: #166534;
        --color-lime: #84cc16;
        --color-amber: #d97706;
        --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
        --font-serif: 'Instrument Serif', Georgia, serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }

      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
      }

      .frame {
        max-width: 1050px;
        width: 100%;
        margin: 0 auto;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }

      h1 {
        font-family: var(--font-serif);
        font-size: 2.1rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 0.5rem;
      }

      .desc {
        font-size: 0.92rem;
        color: var(--color-muted);
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }

      svg {
        width: 100%;
        display: block;
        border: 1px solid var(--color-rule-solid);
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">06 · Quality Control & Audit Gate · Workflow C</p>
      <h1>Quy trình Thẩm định & Duyệt của Quản lý (Review & Rework)</h1>
      <p class="desc">
        Cổng kiểm soát 5 chốt bằng chứng, phân nhánh quyết định Phê duyệt hoặc Trả việc làm lại kèm lý do bắt buộc.
      </p>

      <svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rr-title rr-desc">
        <title id="rr-title">NOVYX Review and Rework Lifecycle</title>
        <desc id="rr-desc">
          Sơ đồ máy trạng thái quy trình thẩm định của Quản lý với hai nhánh Duyệt và Yêu cầu làm lại.
        </desc>

        <defs>
          <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#166534" />
          </marker>
          <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#D97706" />
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#FBFBF9" />

        <!-- STATE: WAITING_REVIEW -->
        <g transform="translate(60, 200)">
          <rect x="0" y="0" width="180" height="110" rx="8" fill="#FFF" stroke="#D97706" stroke-width="2" />
          <text x="16" y="32" font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#112116">
            WAITING_REVIEW
          </text>
          <text x="16" y="52" font-family="'Geist', sans-serif" font-size="11" fill="#D97706">Báo cáo chờ duyệt</text>
          <line x1="16" y1="62" x2="164" y2="62" stroke="#E2E0D8" />
          <text x="16" y="80" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">Nằm trong hàng đợi</text>
          <text x="16" y="96" font-family="'Geist', sans-serif" font-size="10" fill="#112116">Quản lý mở chi tiết</text>
        </g>

        <!-- Arrow to Audit Gate -->
        <line x1="240" y1="255" x2="315" y2="255" stroke="#112116" stroke-width="2" marker-end="url(#arr)" />

        <!-- AUDIT GATE (Diamond / Decision Hub) -->
        <g transform="translate(320, 160)">
          <rect
            x="0"
            y="0"
            width="260"
            height="190"
            rx="8"
            fill="rgba(17,33,22,0.03)"
            stroke="#112116"
            stroke-width="1.8"
          />
          <rect x="20" y="-12" width="160" height="22" rx="4" fill="#112116" />
          <text x="30" y="3" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#84CC16">
            5-POINT AUDIT GATE
          </text>

          <text x="20" y="32" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#112116">
            Quản lý đối soát bằng chứng:
          </text>
          <text x="20" y="56" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
            ✓ GPS &lt;= 10m &amp; Timestamp
          </text>
          <text x="20" y="76" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
            ✓ QR quét khớp đúng mã cây
          </text>
          <text x="20" y="96" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
            ✓ Cặp ảnh Trước/Sau rõ nét
          </text>
          <text x="20" y="116" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
            ✓ Checklist hoàn tất 100%
          </text>
          <text x="20" y="136" font-family="'Geist', sans-serif" font-size="11" fill="#112116">
            ✓ Ghi chú hiện trường của Staff
          </text>

          <line x1="20" y1="150" x2="240" y2="150" stroke="#E2E0D8" />
          <text x="20" y="172" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#166534">
            reviewProofGaps === 0 ?
          </text>
        </g>

        <!-- BRANCH A: APPROVE (Top Right) -->
        <path
          d="M 580 210 L 680 120 L 720 120"
          fill="none"
          stroke="#166534"
          stroke-width="2.5"
          marker-end="url(#arr)"
        />
        <rect x="610" y="130" width="80" height="22" rx="4" fill="rgba(132,204,22,0.18)" />
        <text x="620" y="145" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#166534">
          ĐẠT (Gaps=0)
        </text>

        <g transform="translate(730, 60)">
          <rect x="0" y="0" width="200" height="120" rx="8" fill="#166534" />
          <rect x="4" y="4" width="192" height="112" rx="6" fill="none" stroke="#84CC16" stroke-width="1.5" />
          <text x="20" y="32" font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#FFF">
            PHÊ DUYỆT (APPROVE)
          </text>
          <text x="20" y="52" font-family="'Geist', sans-serif" font-size="11" fill="#84CC16">
            Task: COMPLETED [TERMINAL]
          </text>
          <line x1="20" y1="62" x2="180" y2="62" stroke="rgba(255,255,255,0.2)" />
          <text x="20" y="80" font-family="'Geist', sans-serif" font-size="10" fill="#FFF">1. Khép kín nhiệm vụ</text>
          <text x="20" y="96" font-family="'Geist', sans-serif" font-size="10" fill="#FFF">
            2. Ghi nhận CareHistory cho cây
          </text>
          <text x="20" y="112" font-family="'Geist', sans-serif" font-size="10" fill="#FFF">
            3. Bắn thông báo xanh cho Staff
          </text>
        </g>

        <!-- BRANCH B: REQUEST REWORK (Bottom Right) -->
        <path
          d="M 580 300 L 680 390 L 720 390"
          fill="none"
          stroke="#D97706"
          stroke-width="2.5"
          marker-end="url(#arr-amber)"
        />
        <rect x="600" y="360" width="105" height="22" rx="4" fill="rgba(217,119,6,0.18)" />
        <text x="608" y="375" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#D97706">
          TỪ CHỐI / LỖI
        </text>

        <g transform="translate(730, 330)">
          <rect x="0" y="0" width="215" height="150" rx="8" fill="#FFF" stroke="#D97706" stroke-width="2" />
          <text x="16" y="30" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#D97706">
            YÊU CẦU LÀM LẠI (REWORK)
          </text>
          <text x="16" y="48" font-family="'Geist', sans-serif" font-size="10" fill="#112116">
            Guard (DR-07): rejectReason !== ''
          </text>
          <line x1="16" y1="58" x2="199" y2="58" stroke="#E2E0D8" />
          <text x="16" y="76" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">
            • Chọn lý do từ chips chuẩn
          </text>
          <text x="16" y="92" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">
            • Hoặc gõ lý do chi tiết tự do
          </text>
          <text x="16" y="112" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#D97706">
            -> Task: REWORK_REQUIRED
          </text>
          <text x="16" y="128" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">
            Bảo toàn bằng chứng cũ đã đạt
          </text>
          <text x="16" y="142" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">
            Staff thấy cảnh báo và làm lại
          </text>
        </g>
      </svg>
    </div>
  </body>
</html>
