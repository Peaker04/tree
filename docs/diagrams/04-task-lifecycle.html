<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>04 - NOVYX Task Lifecycle State Machine</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #fbfbf9;
        --color-paper-2: #f0efea;
        --color-ink: #112116;
        --color-muted: #68756b;
        --color-rule: rgba(17, 33, 22, 0.08);
        --color-rule-solid: #e2e0d8;
        --color-accent: #166534;
        --color-lime: #84cc16;
        --color-amber: #d97706;
        --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
        --font-serif: 'Instrument Serif', Georgia, serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }

      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
      }

      .frame {
        max-width: 1050px;
        width: 100%;
        margin: 0 auto;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }

      h1 {
        font-family: var(--font-serif);
        font-size: 2.1rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 0.5rem;
      }

      .desc {
        font-size: 0.92rem;
        color: var(--color-muted);
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }

      svg {
        width: 100%;
        display: block;
        border: 1px solid var(--color-rule-solid);
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">04 · Canonical State Machine · Workflow A</p>
      <h1>Vòng đời Nhiệm vụ (Task Lifecycle State Machine)</h1>
      <p class="desc">
        Các trạng thái chính thức của thực thể Task, điều kiện bảo vệ (Guards) và luồng hồi phục khi bị yêu cầu làm lại.
      </p>

      <svg viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tl-title tl-desc">
        <title id="tl-title">NOVYX Task Lifecycle</title>
        <desc id="tl-desc">Biểu đồ trạng thái nhiệm vụ từ Pending đến Completed kèm luồng Rework.</desc>

        <defs>
          <marker id="arr-main" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#112116" />
          </marker>
          <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#166534" />
          </marker>
          <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#D97706" />
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#FBFBF9" />

        <!-- START NODE -->
        <circle cx="60" cy="180" r="12" fill="#112116" />
        <line x1="72" y1="180" x2="115" y2="180" stroke="#112116" stroke-width="2" marker-end="url(#arr-main)" />
        <text x="65" y="150" font-family="'Geist Mono', monospace" font-size="10" fill="#68756B">CreateTask</text>

        <!-- STATE 1: PENDING -->
        <g transform="translate(120, 140)">
          <rect x="0" y="0" width="140" height="80" rx="8" fill="#FFF" stroke="#E2E0D8" stroke-width="1.8" />
          <text x="16" y="32" font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#112116">
            PENDING
          </text>
          <text x="16" y="52" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">Chờ bắt đầu</text>
          <text x="16" y="68" font-family="'Geist Mono', monospace" font-size="9" fill="#68756B">
            Trong hàng đợi việc
          </text>
        </g>

        <!-- Arrow 1 -> 2 -->
        <line x1="260" y1="180" x2="335" y2="180" stroke="#112116" stroke-width="2" marker-end="url(#arr-main)" />
        <text x="270" y="165" font-family="'Geist Mono', monospace" font-size="10" fill="#112116">StartTask</text>
        <text x="265" y="205" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">[Staff mở task]</text>

        <!-- STATE 2: IN_PROGRESS -->
        <g transform="translate(340, 130)">
          <rect
            x="0"
            y="0"
            width="165"
            height="100"
            rx="8"
            fill="rgba(132,204,22,0.08)"
            stroke="#84CC16"
            stroke-width="2"
          />
          <text x="16" y="32" font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#112116">
            IN_PROGRESS
          </text>
          <text x="16" y="52" font-family="'Geist', sans-serif" font-size="11" fill="#166534">Đang thực hiện</text>
          <text x="16" y="72" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">Thực thi quy trình</text>
          <text x="16" y="88" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#166534">
            5 chốt bằng chứng
          </text>
        </g>

        <!-- Arrow 2 -> 3 -->
        <line x1="505" y1="180" x2="575" y2="180" stroke="#166534" stroke-width="2" marker-end="url(#arr-green)" />
        <text x="510" y="155" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#166534">
          SubmitEvidence
        </text>
        <text x="512" y="172" font-family="'Geist Mono', monospace" font-size="9" fill="#D97706">[Guard: 5/5 Đủ]</text>
        <text x="515" y="205" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">[Staff nộp]</text>

        <!-- STATE 3: WAITING_REVIEW -->
        <g transform="translate(580, 130)">
          <rect x="0" y="0" width="165" height="100" rx="8" fill="#FFF" stroke="#D97706" stroke-width="2" />
          <text x="16" y="32" font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#112116">
            WAITING_REVIEW
          </text>
          <text x="16" y="52" font-family="'Geist', sans-serif" font-size="11" fill="#D97706">Chờ phê duyệt</text>
          <text x="16" y="72" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">Tại hàng đợi duyệt</text>
          <text x="16" y="88" font-family="'Geist Mono', monospace" font-size="10" fill="#112116">
            Manager thẩm định
          </text>
        </g>

        <!-- Branch 1: Approve -> Terminal COMPLETED -->
        <line x1="745" y1="180" x2="815" y2="180" stroke="#166534" stroke-width="2.5" marker-end="url(#arr-green)" />
        <text x="750" y="155" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#166534">
          Approve
        </text>
        <text x="748" y="172" font-family="'Geist Mono', monospace" font-size="9" fill="#166534">[Gaps === 0]</text>
        <text x="750" y="205" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">[Manager duyệt]</text>

        <!-- STATE 4: COMPLETED (Terminal) -->
        <g transform="translate(820, 130)">
          <rect x="0" y="0" width="130" height="100" rx="8" fill="#166534" stroke="#112116" stroke-width="2" />
          <rect x="4" y="4" width="122" height="92" rx="6" fill="none" stroke="#84CC16" stroke-width="1.5" />
          <text x="16" y="34" font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#FFF">
            COMPLETED
          </text>
          <text x="16" y="54" font-family="'Geist', sans-serif" font-size="11" fill="#FFF">Hoàn thành</text>
          <text x="16" y="74" font-family="'Geist Mono', monospace" font-size="9" fill="#84CC16">[TERMINAL]</text>
          <text x="16" y="88" font-family="'Geist', sans-serif" font-size="9" fill="#E2E0D8">Đóng vĩnh viễn</text>
        </g>

        <!-- Branch 2: Rework Required (Down & Loopback) -->
        <path
          d="M 662 230 L 662 380 L 525 380"
          fill="none"
          stroke="#D97706"
          stroke-width="2"
          marker-end="url(#arr-amber)"
        />
        <text x="672" y="290" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#D97706">
          RequestRework
        </text>
        <text x="672" y="306" font-family="'Geist Mono', monospace" font-size="9" fill="#D97706">
          [Guard: rejectReason !== '']
        </text>

        <!-- STATE 5: REWORK_REQUIRED -->
        <g transform="translate(340, 335)">
          <rect x="0" y="0" width="180" height="90" rx="8" fill="#FFF" stroke="#D97706" stroke-width="2" />
          <text x="16" y="30" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#D97706">
            REWORK_REQUIRED
          </text>
          <text x="16" y="48" font-family="'Geist', sans-serif" font-size="11" fill="#112116">Yêu cầu làm lại</text>
          <text x="16" y="66" font-family="'Geist', sans-serif" font-size="10" fill="#68756B">
            Ưu tiên số 0 trên hàng đợi
          </text>
          <text x="16" y="80" font-family="'Geist', sans-serif" font-size="10" fill="#D97706">
            Bảo toàn bằng chứng cũ
          </text>
        </g>

        <!-- Arrow Rework -> In_Progress -->
        <line x1="422" y1="335" x2="422" y2="235" stroke="#112116" stroke-width="2" marker-end="url(#arr-main)" />
        <text x="430" y="280" font-family="'Geist Mono', monospace" font-size="10" fill="#112116">ResumeRework</text>
        <text x="430" y="296" font-family="'Geist', sans-serif" font-size="9" fill="#68756B">[Mở đúng bước thiếu]</text>
      </svg>
    </div>
  </body>
</html>
