<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>08 - NOVYX Role Information Architecture</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #fbfbf9;
        --color-paper-2: #f0efea;
        --color-ink: #112116;
        --color-muted: #68756b;
        --color-rule: rgba(17, 33, 22, 0.08);
        --color-rule-solid: #e2e0d8;
        --color-accent: #166534;
        --color-lime: #84cc16;
        --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
        --font-serif: 'Instrument Serif', Georgia, serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }

      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
      }

      .frame {
        max-width: 1150px;
        width: 100%;
        margin: 0 auto;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }

      h1 {
        font-family: var(--font-serif);
        font-size: 2.1rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 0.5rem;
      }

      .desc {
        font-size: 0.92rem;
        color: var(--color-muted);
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }

      svg {
        width: 100%;
        display: block;
        border: 1px solid var(--color-rule-solid);
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">08 · Mobile Navigation &amp; IA · Tree Diagram</p>
      <h1>Kiến trúc Thông tin &amp; Điều hướng theo Vai trò (IA)</h1>
      <p class="desc">
        Cấu trúc thanh điều hướng 5 chốt (Notched Bottom Nav) và các không gian làm việc chuyên biệt cho Nhân viên
        (Staff) và Quản lý (Manager).
      </p>

      <svg viewBox="0 0 1080 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ia-title ia-desc">
        <title id="ia-title">NOVYX Role Information Architecture</title>
        <desc id="ia-desc">Sơ đồ cây cấu trúc màn hình theo vai trò người dùng trong ứng dụng di động NOVYX.</desc>

        <defs>
          <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
            <polygon points="0 0, 6 2.5, 0 5" fill="#68756B" />
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#FBFBF9" />

        <!-- ROOT: APP AUTH SHELL -->
        <g transform="translate(440, 25)">
          <rect x="0" y="0" width="200" height="45" rx="6" fill="#112116" />
          <text
            x="100"
            y="28"
            text-anchor="middle"
            font-family="'Geist', sans-serif"
            font-size="13"
            font-weight="600"
            fill="#84CC16"
          >
            NOVYX Mobile App
          </text>
        </g>

        <line x1="540" y1="70" x2="270" y2="115" stroke="#68756B" stroke-width="1.5" marker-end="url(#arr)" />
        <line x1="540" y1="70" x2="810" y2="115" stroke="#68756B" stroke-width="1.5" marker-end="url(#arr)" />

        <!-- STAFF BRANCH (LEFT) -->
        <g transform="translate(150, 115)">
          <rect x="0" y="0" width="240" height="50" rx="6" fill="#166534" />
          <text
            x="120"
            y="26"
            text-anchor="middle"
            font-family="'Geist', sans-serif"
            font-size="14"
            font-weight="600"
            fill="#FFF"
          >
            KHÔNG GIAN NHÂN VIÊN
          </text>
          <text x="120" y="42" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#84CC16">
            Role: Staff
          </text>
        </g>

        <!-- STAFF 5-ACTION NAV (TABS) -->
        <g transform="translate(40, 195)">
          <!-- Tab 1 -->
          <rect x="0" y="0" width="85" height="45" rx="4" fill="#FFF" stroke="#E2E0D8" />
          <text x="42" y="22" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600">
            Trang chủ
          </text>
          <text x="42" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#68756B">
            HOME
          </text>

          <!-- Tab 2 -->
          <rect x="95" y="0" width="85" height="45" rx="4" fill="#FFF" stroke="#E2E0D8" />
          <text x="137" y="22" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600">
            Cây của tôi
          </text>
          <text x="137" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#68756B">
            MY_TREES
          </text>

          <!-- Center FAB -->
          <rect x="190" y="0" width="85" height="45" rx="4" fill="#166534" />
          <text
            x="232"
            y="22"
            text-anchor="middle"
            font-family="'Geist', sans-serif"
            font-size="10"
            font-weight="600"
            fill="#84CC16"
          >
            Quét QR FAB
          </text>
          <text x="232" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#FFF">
            RESUME/SCAN
          </text>

          <!-- Tab 3 -->
          <rect x="285" y="0" width="85" height="45" rx="4" fill="#FFF" stroke="#E2E0D8" />
          <text x="327" y="22" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600">
            Công việc
          </text>
          <text x="327" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#68756B">
            WORK
          </text>

          <!-- Tab 4 -->
          <rect x="380" y="0" width="85" height="45" rx="4" fill="#FFF" stroke="#E2E0D8" />
          <text x="422" y="22" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600">
            Tài khoản
          </text>
          <text x="422" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#68756B">
            ACCOUNT
          </text>
        </g>

        <!-- STAFF DEEP WORKFLOW: PROOF FLOW -->
        <g transform="translate(60, 270)">
          <rect
            x="0"
            y="0"
            width="420"
            height="340"
            rx="8"
            fill="rgba(132,204,22,0.05)"
            stroke="#84CC16"
            stroke-width="1.5"
          />
          <text x="20" y="30" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#112116">
            Luồng chuyên sâu: StaffProofFlow (Hiden Nav)
          </text>
          <text x="20" y="48" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
            Kích hoạt từ thẻ việc cần làm hoặc bấm nút FAB
          </text>
          <line x1="20" y1="60" x2="400" y2="60" stroke="#E2E0D8" />

          <!-- Steps list -->
          <g transform="translate(20, 80)">
            <text x="0" y="15" font-family="'Geist', sans-serif" font-size="12" fill="#112116">
              • GPS Check-in (Khoảng cách &lt;= 10m, độ chính xác)
            </text>
            <text x="0" y="45" font-family="'Geist', sans-serif" font-size="12" fill="#112116">
              • Quét mã QR cây (Camera scanner hoặc nhập mã)
            </text>
            <text x="0" y="75" font-family="'Geist', sans-serif" font-size="12" fill="#112116">
              • Chụp ảnh trước tác nghiệp (Preview, chụp lại nếu mờ)
            </text>
            <text x="0" y="105" font-family="'Geist', sans-serif" font-size="12" fill="#112116">
              • Thực hiện &amp; tích checklist kỹ thuật (100% hoàn thành)
            </text>
            <text x="0" y="135" font-family="'Geist', sans-serif" font-size="12" fill="#112116">
              • Chụp ảnh nghiệm thu sau khi hoàn thành
            </text>
            <text x="0" y="165" font-family="'Geist', sans-serif" font-size="12" fill="#112116">
              • Rà soát cổng bằng chứng 5/5 &amp; ghi chú
            </text>
            <text x="0" y="195" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#166534">
              • Nộp báo cáo thành công (Chuyển sang Waiting_Review)
            </text>
            <text x="0" y="225" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              • Màn hình thông báo vận hành cá nhân
            </text>
          </g>
        </g>

        <!-- MANAGER BRANCH (RIGHT) -->
        <g transform="translate(690, 115)">
          <rect x="0" y="0" width="240" height="50" rx="6" fill="#112116" />
          <text
            x="120"
            y="26"
            text-anchor="middle"
            font-family="'Geist', sans-serif"
            font-size="14"
            font-weight="600"
            fill="#FFF"
          >
            KHÔNG GIAN QUẢN LÝ
          </text>
          <text x="120" y="42" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#84CC16">
            Role: Manager
          </text>
        </g>

        <!-- MANAGER 5-ACTION NAV (TABS) -->
        <g transform="translate(580, 195)">
          <!-- Tab 1 -->
          <rect x="0" y="0" width="85" height="45" rx="4" fill="#FFF" stroke="#E2E0D8" />
          <text x="42" y="22" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600">
            Tổng quan
          </text>
          <text x="42" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#68756B">
            HOME
          </text>

          <!-- Tab 2 -->
          <rect x="95" y="0" width="85" height="45" rx="4" fill="#FFF" stroke="#E2E0D8" />
          <text x="137" y="22" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600">
            Giao việc
          </text>
          <text x="137" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#68756B">
            CREATE
          </text>

          <!-- Center FAB -->
          <rect x="190" y="0" width="85" height="45" rx="4" fill="#112116" />
          <text
            x="232"
            y="22"
            text-anchor="middle"
            font-family="'Geist', sans-serif"
            font-size="10"
            font-weight="600"
            fill="#84CC16"
          >
            Tra cứu QR
          </text>
          <text x="232" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#FFF">
            LOOKUP FAB
          </text>

          <!-- Tab 3 -->
          <rect x="285" y="0" width="85" height="45" rx="4" fill="#FFF" stroke="#E2E0D8" />
          <text x="327" y="22" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600">
            Duyệt việc
          </text>
          <text x="327" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#68756B">
            REVIEW
          </text>

          <!-- Tab 4 -->
          <rect x="380" y="0" width="85" height="45" rx="4" fill="#FFF" stroke="#E2E0D8" />
          <text x="422" y="22" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600">
            Tài khoản
          </text>
          <text x="422" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#68756B">
            ACCOUNT
          </text>
        </g>

        <!-- MANAGER DEEP WORKFLOW: REVIEW & LOOKUP -->
        <g transform="translate(600, 270)">
          <rect x="0" y="0" width="420" height="340" rx="8" fill="#F0EFEA" stroke="#E2E0D8" stroke-width="1.5" />
          <text x="20" y="30" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#112116">
            Các màn hình chuyên sâu của Quản lý
          </text>
          <text x="20" y="48" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
            Thẩm định bằng chứng và điều hành danh mục
          </text>
          <line x1="20" y1="60" x2="400" y2="60" stroke="#E2E0D8" />

          <g transform="translate(20, 80)">
            <text x="0" y="15" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#112116">
              • ManagerReviewDetail (Màn chi tiết thẩm định)
            </text>
            <text x="15" y="35" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              - Đối soát khoảng cách GPS, QR khớp, cặp ảnh
            </text>
            <text x="15" y="55" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              - Khóa nút Phê duyệt khi còn thiếu bằng chứng
            </text>
            <text x="15" y="75" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              - Nhập lý do từ chối bằng chips hoặc text tự do
            </text>

            <text x="0" y="115" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#112116">
              • ManagerQrLookup (Tra cứu cây thực địa)
            </text>
            <text x="15" y="135" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              - Quét mã cây -> Hiển thị thông số và CareHistory
            </text>

            <text x="0" y="175" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#112116">
              • ManagerTrees (Danh mục cây xanh đô thị)
            </text>
            <text x="15" y="195" font-family="'Geist', sans-serif" font-size="11" fill="#68756B">
              - Lọc cây theo rủi ro (sâu bệnh, nghiêng, quá hạn)
            </text>

            <text x="0" y="235" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#112116">
              • ManagerCreateTask (Biểu mẫu giao việc)
            </text>
          </g>
        </g>
      </svg>
    </div>
  </body>
</html>
